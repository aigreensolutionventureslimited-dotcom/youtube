<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Watch Wall (100)</title>
<style>
  :root { --bg:#0f0f12; --panel:#1a1a20; --text:#eee; --muted:#9a9aa5; --accent:#ff2d2d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { position:sticky; top:0; z-index:10; background:rgba(15,15,18,.95); backdrop-filter:blur(6px); padding:12px 16px; border-bottom:1px solid #2a2a33; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  h1 { font-size:18px; margin:0 12px 0 0; }
  h1 span { color:var(--accent); }
  button { background:var(--panel); color:var(--text); border:1px solid #33333d; padding:8px 12px; border-radius:8px; cursor:pointer; font-size:14px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  input[type=text] { background:#0f0f12; color:var(--text); border:1px solid #33333d; border-radius:8px; padding:8px 10px; font-size:14px; }
  label { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  input[type=range] { accent-color:var(--accent); }
  #addbar { display:flex; gap:8px; flex:1 1 360px; min-width:260px; }
  #addbar input { flex:1; }
  #count { color:var(--muted); font-size:13px; }
  #msg { width:100%; font-size:12px; color:#ff8a8a; min-height:0; }
  #wall { display:grid; gap:8px; padding:12px; grid-template-columns:repeat(var(--cols,5), 1fr); }
  .tile { position:relative; aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden; }
  .tile.empty { background:var(--panel); border:1px dashed #3a3a46; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:8px; }
  .tile.empty input { width:90%; font-size:12px; padding:6px 8px; }
  .tile.empty .plus { color:var(--muted); font-size:12px; }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; cursor:pointer; opacity:.85; transition:opacity .15s, transform .15s; }
  .tile:hover img { opacity:1; transform:scale(1.03); }
  .tile .play { position:absolute; inset:0; margin:auto; width:44px; height:30px; background:var(--accent); border-radius:8px; pointer-events:none; }
  .tile .play::after { content:""; position:absolute; left:17px; top:8px; border-left:14px solid #fff; border-top:7px solid transparent; border-bottom:7px solid transparent; }
  .tile .num { position:absolute; top:4px; left:6px; font-size:11px; background:rgba(0,0,0,.6); padding:1px 6px; border-radius:10px; pointer-events:none; z-index:2; }
  .tile .views { position:absolute; left:6px; bottom:6px; z-index:2; font-size:12px; background:rgba(0,0,0,.72); padding:2px 8px; border-radius:10px; pointer-events:none; }
  button.sub { background:#cc0000; border-color:#cc0000; color:#fff; font-weight:700; }
  button.sub:hover { background:#ff0000; border-color:#ff0000; }
  #sharebar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid #2a2a33; }
  #sharebar.flash { box-shadow: inset 0 0 0 2px var(--accent); }
  #sharebar .lbl { font-size:13px; color:var(--muted); }
  #sharebar select { background:#0f0f12; color:var(--text); border:1px solid #33333d; border-radius:8px; padding:8px 10px; font-size:14px; max-width:280px; }
  .sbtn { color:#fff; border:0; font-weight:600; }
  .sbtn.wa { background:#25d366; } .sbtn.x { background:#000; border:1px solid #444; } .sbtn.fb { background:#1877f2; }
  .sbtn.tg { background:#27a7e7; } .sbtn.cp { background:#444; } .sbtn.nt { background:var(--accent); }
  .sbtn:hover { filter:brightness(1.15); border:0; }
  .tile .sh { position:absolute; top:4px; right:34px; z-index:2; background:rgba(0,0,0,.7); border:0; color:#fff; padding:1px 7px; border-radius:10px; font-size:12px; display:none; cursor:pointer; }
  .tile:hover .sh { display:block; }
  .tile .x { position:absolute; top:4px; right:6px; z-index:2; background:rgba(0,0,0,.7); border:0; color:#fff; padding:1px 7px; border-radius:10px; font-size:12px; display:none; }
  .tile:hover .x { display:block; }
  .tile iframe { width:100%; height:100%; border:0; display:block; }
  @media (max-width:700px){ #wall{ grid-template-columns:repeat(2,1fr); } #cols-wrap{display:none;} }
</style>
</head>
<body>
<header>
  <h1><span>▶</span> Watch Wall</h1>
  <div id="addbar">
    <input id="link" type="text" placeholder="Paste one YouTube link and press Enter">
    <button id="add" class="primary">Add</button>
    <button id="fillAll" class="primary" title="Show this one link on all 100 tiles">Post to all 100</button>
  </div>
  <span id="count"></span>
  <button id="subscribe" class="sub" title="Subscribe to the channel on YouTube">▶ Subscribe</button>
  <button id="setChannel" title="Set your channel link, @handle or channel ID">Set channel</button>
  <button id="apiKey" title="YouTube Data API v3 key, used to show view counts">API key</button>
  <button id="refresh" title="Refresh view counts">↻ Views</button>
  <button id="playAll">Play all (muted)</button>
  <button id="stopAll">Stop all</button>
  <button id="clearAll">Clear wall</button>
  <label id="cols-wrap">Columns <input id="cols" type="range" min="2" max="10" value="5"> <span id="colsVal">5</span></label>
  <div id="msg"></div>
</header>

<div id="sharebar">
  <span class="lbl">Share:</span>
  <select id="shareWhat"><option value="wall">This wall page</option></select>
  <button class="sbtn wa" data-s="wa">WhatsApp</button>
  <button class="sbtn x" data-s="x">X</button>
  <button class="sbtn fb" data-s="fb">Facebook</button>
  <button class="sbtn tg" data-s="tg">Telegram</button>
  <button class="sbtn cp" data-s="cp">Copy link</button>
  <button class="sbtn nt" data-s="nt" id="nativeShare">Share…</button>
</div>

<main id="wall"></main>

<script>
const TOTAL = 100;
const KEY = "watchwall.v2";
const wall = document.getElementById("wall");
const msg = document.getElementById("msg");

// slots[i] = video ID or null. One link per tile, no repeats.
let slots = load();

function load(){
  try {
    const v = JSON.parse(localStorage.getItem(KEY));
    if (Array.isArray(v) && v.length === TOTAL) return v;
  } catch(e){}
  return new Array(TOTAL).fill(null);
}
function store(){ try { localStorage.setItem(KEY, JSON.stringify(slots)); } catch(e){} }

function extractId(s){
  s = (s || "").trim();
  if (/^[\w-]{11}$/.test(s)) return s;
  const m = s.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/);
  return m ? m[1] : null;
}
function say(t){ msg.textContent = t || ""; if (t) setTimeout(() => { if (msg.textContent === t) msg.textContent = ""; }, 3500); }

function addToSlot(index, raw){
  const id = extractId(raw);
  if (!id) { say("That doesn't look like a valid YouTube link."); return false; }
  if (slots.includes(id)) { say("That video is already on the wall."); return false; }
  slots[index] = id; store(); render(); return true;
}

function playTile(tile, mute){
  const id = tile.dataset.id;
  tile.querySelector(".thumb")?.remove();
  tile.querySelector(".play")?.remove();
  tile.insertAdjacentHTML("afterbegin",
    '<iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0&playsinline=1'+(mute?'&mute=1':'')+'" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>');
}

function render(){
  wall.innerHTML = "";
  let filled = 0;
  slots.forEach((id, i) => {
    const t = document.createElement("div");
    t.dataset.n = i + 1;
    if (id) {
      filled++;
      t.className = "tile"; t.dataset.id = id;
      t.innerHTML =
        '<img class="thumb" loading="lazy" src="https://i.ytimg.com/vi/'+id+'/mqdefault.jpg" alt="Video '+(i+1)+'">' +
        '<div class="play"></div><div class="num">'+(i+1)+'</div><button class="sh" title="Share this video">⤴</button><button class="x" title="Remove">✕</button>' +
        '<div class="views" data-id="'+id+'" '+(stats[id] ? '' : 'hidden')+'>'+viewsText(id)+'</div>';
      t.querySelector(".thumb").onclick = () => playTile(t, false);
      t.querySelector(".sh").onclick = (e) => {
        e.stopPropagation();
        shareSel.value = id;
        window.scrollTo({ top: 0, behavior: "smooth" });
        const bar = document.getElementById("sharebar");
        bar.classList.add("flash"); setTimeout(() => bar.classList.remove("flash"), 1200);
      };
      t.querySelector(".x").onclick = (e) => { e.stopPropagation(); slots[i] = null; store(); render(); };
    } else {
      t.className = "tile empty";
      t.innerHTML = '<div class="plus">#'+(i+1)+' · add link</div><input type="text" placeholder="Paste link, Enter">';
      const inp = t.querySelector("input");
      inp.addEventListener("keydown", e => { if (e.key === "Enter") addToSlot(i, inp.value); });
      inp.addEventListener("paste", () => setTimeout(() => { if (extractId(inp.value)) addToSlot(i, inp.value); }, 0));
    }
    wall.appendChild(t);
  });
  document.getElementById("count").textContent = filled + " / " + TOTAL;
  refreshShareList();
  fetchStats(false);
}

// ---------- Share bar ----------
const shareSel = document.getElementById("shareWhat");
function refreshShareList(){
  const prev = shareSel.value;
  const seen = new Set();
  let html = '<option value="wall">This wall page</option>';
  slots.forEach((id, i) => {
    if (!id || seen.has(id)) return;
    seen.add(id);
    const label = (stats[id] && stats[id].title) ? stats[id].title : ("Video #" + (i + 1) + " (" + id + ")");
    html += '<option value="' + id + '">' + label.replace(/</g, "&lt;") + '</option>';
  });
  shareSel.innerHTML = html;
  shareSel.value = [...shareSel.options].some(o => o.value === prev) ? prev : "wall";
}
function shareTarget(){
  const v = shareSel.value;
  if (v === "wall") {
    if (location.protocol === "file:") return { url: "", text: "" };
    return { url: location.href.split("#")[0], text: "Check out my YouTube watch wall" };
  }
  return { url: "https://youtu.be/" + v, text: (stats[v] && stats[v].title) || "Watch this video" };
}
function openShare(u){ window.open(u, "_blank", "noopener,noreferrer,width=640,height=560"); }
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (_) {}
    ta.remove(); return ok;
  }
}
document.getElementById("sharebar").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-s]"); if (!b) return;
  const { url, text } = shareTarget();
  if (!url) { say("Host this page on a website first, then you can share the wall page. Pick a single video to share its link now."); return; }
  const U = encodeURIComponent(url), T = encodeURIComponent(text);
  switch (b.dataset.s) {
    case "wa": openShare("https://wa.me/?text=" + encodeURIComponent(text + " " + url)); break;
    case "x":  openShare("https://twitter.com/intent/tweet?text=" + T + "&url=" + U); break;
    case "fb": openShare("https://www.facebook.com/sharer/sharer.php?u=" + U); break;
    case "tg": openShare("https://t.me/share/url?url=" + U + "&text=" + T); break;
    case "cp": say((await copyText(url)) ? "Link copied: " + url : "Couldn't copy. Copy it manually: " + url); break;
    case "nt":
      if (navigator.share) { try { await navigator.share({ title: text, text, url }); } catch (_) {} }
      else say((await copyText(url)) ? "Sharing isn't supported here, link copied instead." : "Sharing isn't supported in this browser.");
      break;
  }
});
if (!navigator.share) document.getElementById("nativeShare").style.display = "none";

// ---------- View counts (YouTube Data API v3) ----------
const API_KEY_STORE = "watchwall.apikey";
let stats = {}; // id -> { views, title }
function getKey(){ try { return localStorage.getItem(API_KEY_STORE) || ""; } catch(e){ return ""; } }
function viewsText(id){
  const s = stats[id];
  if (!s) return "";
  if (s.views == null) return "👁 hidden";
  return "👁 " + new Intl.NumberFormat("en", { notation: "compact", maximumFractionDigits: 1 }).format(s.views);
}
function paintViews(){
  wall.querySelectorAll(".views").forEach(el => {
    const id = el.dataset.id;
    if (stats[id]) { el.textContent = viewsText(id); el.hidden = false; el.parentElement.title = stats[id].title || ""; }
  });
}
let fetching = false;
async function fetchStats(force){
  const key = getKey();
  if (!key || fetching) return;
  const unique = [...new Set(slots.filter(Boolean))].filter(id => force || !stats[id]);
  if (!unique.length) return;
  fetching = true;
  try {
    for (let i = 0; i < unique.length; i += 50) {
      const chunk = unique.slice(i, i + 50);
      const url = "https://www.googleapis.com/youtube/v3/videos?part=statistics,snippet&id=" + chunk.join(",") + "&key=" + encodeURIComponent(key);
      const res = await fetch(url);
      const data = await res.json();
      if (data.error) { say("API error: " + (data.error.message || data.error.code)); break; }
      (data.items || []).forEach(v => {
        stats[v.id] = { views: v.statistics && v.statistics.viewCount != null ? Number(v.statistics.viewCount) : null, title: v.snippet && v.snippet.title, channelId: v.snippet && v.snippet.channelId };
      });
      // If no channel was set yet, use the channel of the first video on the wall
      if (!getChannel()) {
        const first = slots.find(Boolean);
        if (first && stats[first] && stats[first].channelId) { saveChannel(stats[first].channelId); say("Subscribe button linked to the channel of your first video."); }
      }
    }
    paintViews();
    refreshShareList();
  } catch (e) {
    say("Couldn't reach the YouTube API. Check your connection and key.");
  } finally { fetching = false; }
}
// ---------- Subscribe button ----------
const CH_STORE = "watchwall.channel";
function getChannel(){ try { return localStorage.getItem(CH_STORE) || ""; } catch(e){ return ""; } }
function saveChannel(v){ try { v ? localStorage.setItem(CH_STORE, v) : localStorage.removeItem(CH_STORE); } catch(e){} }
// Accepts: channel URL, @handle, or a UC... channel ID. Returns a clean channel URL or "".
function channelUrl(raw){
  raw = (raw || "").trim();
  if (!raw) return "";
  if (/^UC[\w-]{22}$/.test(raw)) return "https://www.youtube.com/channel/" + raw;
  if (/^@[\w.-]+$/.test(raw)) return "https://www.youtube.com/" + raw;
  const m = raw.match(/youtube\.com\/(channel\/UC[\w-]{22}|@[\w.-]+|c\/[\w.-]+|user\/[\w.-]+)/i);
  return m ? "https://www.youtube.com/" + m[1] : "";
}
document.getElementById("setChannel").onclick = () => {
  const v = prompt("Paste your channel link, @handle or channel ID (leave empty to remove):", getChannel());
  if (v === null) return;
  if (!v.trim()) { saveChannel(""); say("Channel removed."); return; }
  const u = channelUrl(v);
  if (!u) { say("That doesn't look like a YouTube channel link, @handle or ID."); return; }
  saveChannel(u); say("Channel saved.");
};
document.getElementById("subscribe").onclick = () => {
  let u = channelUrl(getChannel());
  if (!u) {
    const v = prompt("Paste your channel link, @handle or channel ID:");
    u = channelUrl(v); if (!u) { say("Set your channel first (Set channel button)."); return; }
    saveChannel(u);
  }
  // sub_confirmation=1 opens the channel with the subscribe confirmation popup
  window.open(u + "?sub_confirmation=1", "_blank", "noopener");
};

document.getElementById("apiKey").onclick = () => {
  const k = prompt("Paste your YouTube Data API v3 key (leave empty to remove it):", getKey());
  if (k === null) return;
  try { k.trim() ? localStorage.setItem(API_KEY_STORE, k.trim()) : localStorage.removeItem(API_KEY_STORE); } catch(e){}
  stats = {}; render();
  say(k.trim() ? "Key saved. Loading view counts…" : "Key removed.");
};
document.getElementById("refresh").onclick = () => {
  if (!getKey()) { say("Add your API key first (API key button)."); return; }
  fetchStats(true);
};
setInterval(() => fetchStats(true), 60000); // live-ish update every minute

// Top bar: adds the link into the next empty tile
function addNext(){
  const inp = document.getElementById("link");
  const idx = slots.indexOf(null);
  if (idx === -1) { say("The wall is full (100)."); return; }
  if (addToSlot(idx, inp.value)) { inp.value = ""; inp.focus(); }
}
function fillAll(){
  const inp = document.getElementById("link");
  const id = extractId(inp.value);
  if (!id) { say("Paste a valid YouTube link first."); return; }
  slots = new Array(TOTAL).fill(id); store(); render(); inp.value = "";
  say("Posted to all 100 tiles.");
}
document.getElementById("fillAll").onclick = fillAll;
document.getElementById("add").onclick = addNext;

// YouTube blocks embeds with "player configuration error" (153) when the page has no web address
if (location.protocol === "file:") {
  const b = document.createElement("div");
  b.style.cssText = "background:#3a1f1f;color:#ffd2d2;padding:10px 16px;font-size:13px;border-bottom:1px solid #5a2a2a;";
  b.innerHTML = "⚠ You opened this file directly from your computer. YouTube will show <b>“Video player configuration error”</b> in that case. " +
    "Run it from a web address instead: host it free (Netlify Drop, GitHub Pages, Cloudflare Pages) or run <code>python -m http.server</code> in this folder and open <code>http://localhost:8000/youtube-watch-wall.html</code>.";
  document.body.insertBefore(b, document.querySelector("header"));
}
document.getElementById("link").addEventListener("keydown", e => { if (e.key === "Enter") addNext(); });

document.getElementById("playAll").onclick = () => {
  const n = slots.filter(Boolean).length;
  if (!n) { say("Add some videos first."); return; }
  if (n > 12 && !confirm("Loading " + n + " players at once is heavy and may slow your browser. Continue?")) return;
  wall.querySelectorAll(".tile[data-id]").forEach(t => { if (!t.querySelector("iframe")) playTile(t, true); });
};
document.getElementById("stopAll").onclick = render;
document.getElementById("clearAll").onclick = () => {
  if (confirm("Remove all videos from the wall?")) { slots = new Array(TOTAL).fill(null); store(); render(); }
};

const cols = document.getElementById("cols"), colsVal = document.getElementById("colsVal");
cols.oninput = () => { wall.style.setProperty("--cols", cols.value); colsVal.textContent = cols.value; };

render();
</script>
</body>
</html>
